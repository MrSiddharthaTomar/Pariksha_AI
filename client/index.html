<!doctype html>
<html lang="en">

  <body>
    <div id="root">

          <div style="width:36px;height:36px;border:4px solid #6366f1;border-top-color:transparent;border-radius:50%;margin:0 auto 10px auto;animation:spin 0.9s linear infinite;"></div>
